<div class="committee-container">
  <div class="evaluation-box" *ngIf="!isLoading">
    <h2>แบบประเมินสำหรับคณะกำกับหลักสูตร</h2>
    
    <ng-container *ngIf="formUrl; else noForm">
      <a [href]="formUrl" target="_blank" class="evaluation-link">กดเพื่อทำแบบประเมิน</a>
    </ng-container>
    
    <ng-template #noForm>
      <p class="no-form-text">ยังไม่มีลิงก์แบบประเมินสำหรับรุ่นนี้</p>
    </ng-template>
  </div>
  
  <div class="loading-box" *ngIf="isLoading">
    <p>กำลังโหลดข้อมูล...</p>
  </div>
</div>

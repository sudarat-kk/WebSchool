<div class="page-container">
    <!-- Card Container -->
    <div class="card">

        <!-- Card Header -->
        <div class="card-header">
            <div class="header-title">
                <h2>แสดงข้อมูลแบบฟอร์ม</h2>
                <p>รายการข้อมูลที่มีการส่งเข้าระบบทั้งหมด</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" (click)="onExport()">
                    <i class="icon">📥</i> ส่งออกข้อมูล
                </button>
            </div>
        </div>

        <!-- Card Body / Table Wrapper -->
        <div class="card-body">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ลำดับ</th>
                            <th>วันที่ส่ง</th>
                            <th>ยศ-ชื่อ-นามสกุล</th>
                            <th>อีเมล</th>
                            <th>คำถาม1</th>
                            <th>คำถาม2</th>
                            <th>คำถาม3</th>
                            <th>คำถาม4</th>
                            <th>คำถาม5</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of formDataList; let i = index">
                            <td>{{ i + 1 }}</td>
                            <td>{{ item.submittedAt }}</td>
                            <td>{{ item.name }}</td>
                            <td>{{ item.email }}</td> <!-- 👈 มั่นใจว่าช่องอีเมลอยู่ช่องที่ 4 ตรงนี้ -->
                            <td>{{ item.q1 }}</td> <!-- 👈 คำถาม 1 อยู่ช่องที่ 5 -->
                            <td>{{ item.q2 }}</td>
                            <td>{{ item.q3 }}</td>
                            <td class="col-long-text" [title]="item.q4">{{ item.q4 }}</td>
                            <td>{{ item.q5 }}</td>
                        </tr>
                        <tr *ngIf="formDataList.length === 0">
                            <td colspan="9" class="text-center no-data">ไม่พบข้อมูลแบบฟอร์ม</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
